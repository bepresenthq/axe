name: Build runbp adapter

on:
  push:
    branches: [runbp]
  pull_request:
    branches: [runbp]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/go.mod
          cache-dependency-path: cmd/go.sum
      - run: brew install protobuf
      - run: node scripts/build-runbp.mjs
      - run: test "$(.output/axe --version)" = "axe version v0.0.14-runbp.2"
